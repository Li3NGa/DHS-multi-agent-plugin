name: 功能建议
description: 为项目提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您的建议！请详细描述您的想法。

  - type: textarea
    id: problem
    attributes:
      label: 您的功能建议与某个问题相关吗？
      description: 请清晰描述您遇到的问题。
      placeholder: 当我尝试...时，我总是感到困扰，因为...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: 您期望的解决方案
      description: 请描述您希望看到的功能。
      placeholder: 我希望能有...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 您考虑过的替代方案
      description: 请描述您考虑过的其他解决方案。
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 其他上下文
      description: 其他背景信息、截图或相关链接。
    validations:
      required: false
