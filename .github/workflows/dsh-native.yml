name: DSH Native Runtime CI (source of truth)

# THE official Native Runtime signal for dsh-native/ (Task / TaskGraph /
# Scheduler / AgentRunner / strategies), including the real-DSH-runtime
# smoke suite (bundle artifact + config-created agents). The root native
# plugin keeps a separate transitional job inside ci.yml
# ("Native root plugin (transitional)") until the convergence migration
# retires it; do not add another workflow claiming to be the native test.

on:
  push:
    branches: [main, master]
    paths:
      - "dsh-native/**"
      - ".github/workflows/dsh-native.yml"
  pull_request:
    paths:
      - "dsh-native/**"
      - ".github/workflows/dsh-native.yml"

jobs:
  native-runtime:
    name: Native runtime (typecheck / test / smoke / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: dsh-native/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Real-runtime smoke (bundle + config-created agents)
        run: pnpm test:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-bundle
          path: dsh-native/dist/dsh.bundle.js
