name: DSH Native Runtime CI (source of truth)

# The authoritative Native Runtime signal for packages/dsh-multi-agent/.
# The legacy dsh-native tree is not a production build target and has no
# independent CI workflow. Its historical verification state is protected by
# the `dhs-root-native-final` tag.

on:
  push:
    branches: [main, master]
    paths:
      - "packages/dsh-multi-agent/**"
      - "scripts/check-native-source.mjs"
      - "scripts/check-npm-release.mjs"
      - "scripts/check-release-contract.mjs"
      - "scripts/check-public-api.mjs"
      - "scripts/check-public-surface.mjs"
      - "scripts/check-actions-runtime.mjs"
      - "scripts/check-release-candidate.mjs"
      - "scripts/patch-native-declarations.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "cordis.patch.yml"
      - "README.md"
      - ".github/workflows/native-runtime.yml"
  pull_request:
    paths:
      - "packages/dsh-multi-agent/**"
      - "scripts/check-native-source.mjs"
      - "scripts/check-npm-release.mjs"
      - "scripts/check-release-contract.mjs"
      - "scripts/check-public-api.mjs"
      - "scripts/check-public-surface.mjs"
      - "scripts/check-actions-runtime.mjs"
      - "scripts/check-release-candidate.mjs"
      - "scripts/patch-native-declarations.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "cordis.patch.yml"
      - "README.md"
      - ".github/workflows/native-runtime.yml"

permissions:
  contents: read

jobs:
  native-runtime:
    name: Native runtime (typecheck / unit / build / real-DSH smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate workflow action runtimes
        run: node scripts/check-actions-runtime.mjs
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace (frozen)
        run: pnpm install --frozen-lockfile
      - name: Native source-of-truth guard
        run: node scripts/check-native-source.mjs
      - name: Typecheck
        run: pnpm --dir packages/dsh-multi-agent typecheck
      - name: Unit tests
        run: pnpm --dir packages/dsh-multi-agent test
      - name: Build package bundle
        run: pnpm --dir packages/dsh-multi-agent build
      - name: Build root release entry + real-DSH smoke
        run: pnpm test:smoke
      - name: Release candidate gate
        run: pnpm release:rc
      - name: Validate release metadata
        run: pnpm release:check "npm-v$(node -p "require('./package.json').version")"
      - name: Validate release contract
        run: pnpm release:contract
      - name: Validate public API
        run: pnpm api:check
      - name: Validate public product surface
        run: pnpm surface:check
      - name: Clean npm consumer package smoke
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          npm pack --pack-destination "$tmp_dir"
          archive="$(find "$tmp_dir" -maxdepth 1 -type f -name 'dhs-multi-agent-*.tgz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | grep -Fx 'package/cordis.patch.yml'
          tar -tzf "$archive" | grep -Fx 'package/dist/index.js'
          tar -tzf "$archive" | grep -Fx 'package/dist/types/index.d.ts'
          mkdir "$tmp_dir/consumer"
          cd "$tmp_dir/consumer"
          npm init -y
          npm install "$archive"
          node --input-type=module <<'NODE'
          const mod = await import('dhs-multi-agent')
          const required = ['apply', 'AgentRunner', 'Scheduler', 'runDag', 'createSupervisor', 'createRecoveryManager']
          for (const key of required) {
            if (!(key in mod)) throw new Error(`missing public export: ${key}`)
          }
          console.log(`npm consumer import OK: ${required.join(', ')}`)
          NODE
          npm install --save-dev typescript@5.8.2
          cat > types-smoke.ts <<'TS'
          import { Task, type TaskOutcome, type TaskSpec } from 'dhs-multi-agent'

          const spec: TaskSpec = { id: 'type-smoke', agentId: 'agent', prompt: 'hello' }
          const task = new Task(spec)
          const outcome: TaskOutcome = {
            taskId: task.id,
            status: 'completed',
            text: undefined,
            error: undefined,
            raw: undefined,
            durationMs: 1,
          }
          void outcome
          TS
          npx --no-install tsc --noEmit --module NodeNext --moduleResolution NodeNext --target ES2022 --lib ES2022,DOM,ESNext.Disposable types-smoke.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-release-artifacts
          path: |
            dist/index.js
            dist/types/index.d.ts
            packages/dsh-multi-agent/dist/dsh.bundle.js
