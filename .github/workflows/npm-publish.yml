name: Publish Native npm Package

# Native package releases are isolated from the Python PyPI workflow.
# Create npm trusted publishing for this exact workflow before using a tag.
# Release tags must be npm-vX.Y.Z and must match package.json exactly.

on:
  push:
    tags:
      - 'npm-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish dhs-multi-agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node 22 baseline
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install workspace (frozen)
        run: pnpm install --frozen-lockfile

      - name: Verify native source-of-truth
        run: node scripts/check-native-source.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build distributable
        run: pnpm run build

      - name: Verify release tag matches package version
        run: pnpm release:check "$GITHUB_REF_NAME"

      - name: Verify release contract
        run: pnpm release:contract

      - name: Verify public API
        run: pnpm api:check

      - name: Verify public product surface
        run: pnpm surface:check

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish with npm trusted publishing
        run: npm publish --access public
