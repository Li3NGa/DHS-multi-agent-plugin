name: Publish

# 发布流水线：由 v* 标签触发，构建 Python 包并双通道分发：
#   1. 上传到 PyPI（pip install deepseek-multi-agent-plugin）；
#   2. 把 wheel / sdist 附加到对应的 GitHub Release。
#
# 注意：PYPI_API_TOKEN 需要仓库 owner 在 GitHub 仓库的
# Settings → Secrets and variables → Actions 中配置（在 PyPI 官网申请 API token）。
# 未配置该 Secret 时，job 1 的 Publish 步骤会失败——这是预期行为，
# 此时请改用 docs/publishing.md 中的本地手动发布命令。

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflow action runtimes
        run: node scripts/check-actions-runtime.mjs

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload distributions as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          username: __token__
          password: ${{ env.PYPI_API_TOKEN }}
      - name: Skip PyPI (token not configured)
        if: env.PYPI_API_TOKEN == ''
        run: echo "PYPI_API_TOKEN not configured; PyPI publish skipped (see docs/publishing.md)"

  release-upload:
    name: Upload assets to GitHub Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Attach wheel and sdist to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
