name: Publish

# 发布流水线：由 v* 标签触发，构建 Python 包并双通道分发：
#   1. 上传到 PyPI（pip install deepseek-multi-agent-plugin）；
#   2. 把 wheel / sdist 附加到对应的 GitHub Release。
#
# 注意：PYPI_API_TOKEN 需要仓库 owner 在 GitHub 仓库的
# Settings → Secrets and variables → Actions 中配置（在 PyPI 官网申请 API token）。
# 未配置该 Secret 时，job 1 的 Publish 步骤会失败——这是预期行为，
# 此时请改用 docs/publishing.md 中的本地手动发布命令。

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload distributions as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          username: __token__
          password: ${{ env.PYPI_API_TOKEN }}
      - name: Skip PyPI (token not configured)
        if: env.PYPI_API_TOKEN == ''
        run: echo "PYPI_API_TOKEN not configured; PyPI publish skipped (see docs/publishing.md)"

  release-upload:
    name: Upload assets to GitHub Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Attach wheel and sdist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
