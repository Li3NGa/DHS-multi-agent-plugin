# Example configuration for deepseek-multi-agent-plugin
#
# Coordinator defaults + a three-agent debate team backed by the DeepSeek
# API. Set the DEEPSEEK_API_KEY environment variable (or add api_key below).
plugin:
  name: deepseek-multi-agent-plugin
  version: 0.2.0

coordinator:
  strategy: debate
  rounds: 3
  timeout_seconds: 30
  # 上下文压缩与效率开关（全部默认关闭，不写这段则完全不压缩）
  context:
    window: 6          # 可选：只保留最近 6 条历史消息（原始 prompt 始终保留、不截断）
    max_chars: 2000    # 可选：每条历史消息保留前 2000 个字符并追加省略号 "…"
    hide_own: false    # 可选：辩论中辩手看不到自己之前的旧发言
  cache: false         # 可选：启用进程内 LLM 响应缓存（线程安全 LRU，默认 128 条）

agents:
  - name: researcher
    kind: deepseek
    role: 研究员
    system_prompt: 你是一名严谨的研究员，擅长收集信息并给出有依据的分析。
    model: deepseek-chat
    temperature: 0.3

  - name: critic
    kind: deepseek
    role: 批评家
    system_prompt: 你是一名挑剔的批评家，善于发现方案中的漏洞与风险。
    model: deepseek-chat
    temperature: 0.7

  - name: judge
    kind: deepseek
    role: 裁判
    system_prompt: 你是一名公正的裁判，会综合各方观点给出最终结论。
    model: deepseek-chat
    temperature: 0.2
