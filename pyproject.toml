[project]
name = "deepseek-multi-agent-plugin"
dynamic = ["version"]
description = "Multi-agent collaboration plugin: broadcast, sequential, debate, supervisor, consensus and relay strategies over DeepSeek/OpenAI-compatible LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [ { name = "Li3NGa" } ]
keywords = ["multi-agent", "llm", "deepseek", "collaboration", "orchestration", "plugin", "mcp", "observability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Li3NGa/deepseek-multi-agent-plugin"
Repository = "https://github.com/Li3NGa/deepseek-multi-agent-plugin"
Issues = "https://github.com/Li3NGa/deepseek-multi-agent-plugin/issues"
Changelog = "https://github.com/Li3NGa/deepseek-multi-agent-plugin/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pyyaml", "ruff", "build"]

[project.scripts]
deepseek-multi-agent = "deepseek_multi_agent_plugin.cli:main"
deepseek-plugin-runner = "deepseek_multi_agent_plugin.adapter_server:main"
deepseek-multi-agent-mcp = "deepseek_multi_agent_plugin.mcp_server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "deepseek_multi_agent_plugin.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
